name: Build Windows

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

# A second push while the first build is still going should replace it, not
# queue behind it. Tag builds are never cancelled: they publish a release.
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

jobs:
  # Fast feedback: the whole frontend, engine and overflow suite runs on Linux
  # in well under a minute and gates the expensive Windows job.
  check:
    name: Typecheck and tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test

      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      # Cairo is a native library. Linux runners can install it in a second;
      # Windows runners cannot, which is why this check lives here.
      - name: Check the icons still match the vector masters
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends libcairo2
          pip install --quiet cairosvg pillow
          python scripts/generate-branding.py
          if git diff --quiet -- src-tauri/icons assets/branding/png; then
            echo "Committed icons match the vector masters."
          else
            echo "::warning::Regenerated icons differ from the committed ones. If you edited an SVG, run scripts/generate-branding.py and commit the result. If you did not, this is a cairosvg/Pillow version difference and can be ignored — the bytes differ, the artwork does not."
            git diff --stat -- src-tauri/icons assets/branding/png
          fi

  build:
    name: Portable exe (${{ matrix.arch }})
    needs: check
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x64
            target: x86_64-pc-windows-msvc
            experimental: false
          # ARM64 has never been run on ARM64 hardware — see BUILD.md. It is
          # built and published when it succeeds, but a failure must not paint
          # the whole repository red over a target we openly call experimental.
          - arch: arm64
            target: aarch64-pc-windows-msvc
            experimental: true

    continue-on-error: ${{ matrix.experimental }}

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
          key: ${{ matrix.target }}

      - name: Install dependencies
        run: npm ci

      # The icons are committed; this job uses them as they are.
      #
      # It used to regenerate them here with cairosvg, which cannot work: on
      # Windows cairosvg needs the native Cairo DLL, and the GitHub runner
      # image does not ship it — `import cairosvg` dies with
      # `no library called "cairo-2" was found`. Rendering the SVG masters is
      # a maintainer task, and the drift check now runs on Linux in the
      # `check` job, where Cairo exists.
      - name: Check the committed icons are present
        shell: bash
        run: |
          missing=0
          for f in src-tauri/icons/icon.ico src-tauri/icons/32x32.png src-tauri/icons/128x128.png; do
            if [ ! -s "$f" ]; then echo "missing or empty: $f"; missing=1; fi
          done
          [ "$missing" -eq 0 ] || {
            echo "::error::Committed icons are missing. Run scripts/generate-branding.py and commit the result."
            exit 1
          }
          echo "Committed icons present."

      - name: Build
        run: cargo build --release --target ${{ matrix.target }} --manifest-path src-tauri/Cargo.toml

      - name: Stage portable executable
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path release | Out-Null
          Copy-Item "src-tauri/target/${{ matrix.target }}/release/b-mark.exe" "release/B mark.exe" -Force

      - name: Verify the executable
        run: |
          pip install pefile
          python scripts/verify-exe.py "release/B mark.exe"

      # Published under a versioned name: two downloads sitting in the same
      # Downloads folder must never be mistakable for each other.
      - name: Name the portable asset after its version
        shell: pwsh
        run: |
          $v = (Get-Content package.json | ConvertFrom-Json).version
          Copy-Item "release/B mark.exe" "release/B mark $v Portable.exe" -Force
          Remove-Item "release/B mark.exe"

      # The installer is built from our own hand-written NSIS script rather
      # than Tauri's generated one, so every registry write it performs is
      # reviewable in installer/b-mark.nsi.
      - name: Install NSIS
        run: choco install nsis -y --no-progress

      - name: Build per-user installer
        shell: pwsh
        run: |
          $v = (Get-Content package.json | ConvertFrom-Json).version
          & "$env:ProgramFiles(x86)\NSIS\makensis.exe" -V2 "-DVERSION=$v" installer/b-mark.nsi

      - name: Checksums
        shell: pwsh
        run: |
          Get-ChildItem release/*.exe | ForEach-Object {
            $h = (Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLower()
            "$h  $($_.Name)"
          } | Set-Content "release/SHA256SUMS-${{ matrix.arch }}.txt" -Encoding ascii
          Get-Content "release/SHA256SUMS-${{ matrix.arch }}.txt"

      - uses: actions/upload-artifact@v7
        with:
          name: b-mark-${{ matrix.arch }}
          path: release/
          if-no-files-found: error

  # Attaching files to a release is destructive: an asset with the same name
  # replaces the one already there. If you published binaries you had actually
  # run on Windows, an automatic run would silently swap them for a CI build
  # nobody has ever launched.
  #
  # So this is opt-in. Set the repository variable AUTO_PUBLISH to 'true'
  # (Settings > Secrets and variables > Actions > Variables) once you trust
  # the CI build; until then, tagging still builds and verifies everything and
  # leaves the artifacts for download, but publishing stays a human decision.
  release:
    name: Publish release
    if: startsWith(github.ref, 'refs/tags/v') && vars.AUTO_PUBLISH == 'true'
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v7
        with:
          path: artifacts

      - name: Collect checksums
        run: |
          find artifacts -name 'SHA256SUMS-*.txt' -exec cat {} + > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - uses: softprops/action-gh-release@v3
        with:
          files: |
            artifacts/**/*.exe
            SHA256SUMS.txt
          body: |
            ### Downloads

            | File | Notes |
            |---|---|
            | `B mark <version> Portable.exe` (x64) | Portable. No installation, no Administrator. |
            | `B mark <version> setup.exe` | Per-user installer: installs to `%LOCALAPPDATA%\Programs`, adds a Start Menu entry, and registers `.md` and friends so B mark shows up in "Open with" and Default Apps. No UAC prompt, nothing written to HKLM. |
            | ARM64 builds | Experimental — see BUILD.md. |

            **Requires the Microsoft Edge WebView2 Runtime**, which is present on
            Windows 11 and current Windows 10. B mark never downloads it silently;
            if it is missing the app says so in Persian and English and links to
            Microsoft's official installer.

            **These binaries are not code-signed.** Windows SmartScreen may warn
            on first run and some antivirus engines flag unsigned executables.
            Verify the SHA-256 below against `SHA256SUMS.txt` and, if you like,
            upload the file to VirusTotal. See SECURITY.md for exactly what we do
            and do not claim.
