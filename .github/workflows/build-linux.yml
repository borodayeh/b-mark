name: Build Linux

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-linux-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

jobs:
  # Built on 22.04 on purpose: a binary needs the glibc of the machine it was
  # built on or newer, so the oldest supported runner gives the widest reach.
  build:
    name: .deb and AppImage (x64)
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      # The script installs the system libraries, runs typecheck + tests,
      # builds both packages, writes SHA256SUMS-linux-x64.txt and verifies the
      # .deb contents.
      - name: Build packages
        run: ./scripts/build-linux.sh

      - uses: actions/upload-artifact@v7
        with:
          name: b-mark-linux-x64
          path: release/
          if-no-files-found: error

  # Same opt-in switch as the Windows workflow: publishing stays a human
  # decision until the repository variable AUTO_PUBLISH is 'true'.
  release:
    name: Publish release
    if: startsWith(github.ref, 'refs/tags/v') && vars.AUTO_PUBLISH == 'true'
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v7
        with:
          path: artifacts

      - uses: softprops/action-gh-release@v3
        with:
          files: |
            artifacts/**/*.deb
            artifacts/**/*.AppImage
            artifacts/**/SHA256SUMS-linux-x64.txt
